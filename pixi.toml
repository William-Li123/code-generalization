[workspace]
name = "code-to-reasoning-transfer"
version = "0.1.0"
description = "Training and evaluation code for code-to-reasoning transfer"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.4"

[dependencies]
python = "3.10.*"
pip = "*"
pytorch-gpu = ">=2.3"
transformers = ">=4.51,<5"
datasets = "*"
accelerate = "*"
pyarrow = "*"
pandas = "*"
numpy = "<2"
scipy = "*"
scikit-learn = "*"
pillow = "*"
pytest = "*"
ruff = "*"
pyyaml = "*"

[pypi-dependencies]
peft = ">=0.11"
trl = ">=0.11"
sentencepiece = "*"
datasketch = ">=1.6"
math-verify = ">=0.5.2"

[feature.dapo.pypi-dependencies]
verl = "==0.8.0"

[feature.dapo.dependencies]
ray-default = ">=2.52.1,<3"

[environments]
default = { solve-group = "main" }
dapo = { features = ["dapo"], solve-group = "main" }

[tasks]
validate-repo = "python tests/validate_repository.py"
test = "python -m unittest discover -s tests -v"
compile = "python -m compileall -q experiments evaluation stages dapo tests"
